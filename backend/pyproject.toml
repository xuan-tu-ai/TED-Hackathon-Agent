[project]
name = "backend"
version = "0.1.0"
description = "Anomaly detection and multi-agent diagnostic system for paint shop robots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mosaicml-streaming>=0.13.0",
    "numpy<2.3",
    "pandas>=2.3.3",
    "torch>=2.11.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "dspy-ai>=2.1.0",
    "sqlalchemy>=2.0.0",
    "chromadb>=0.4.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "torchdiffeq>=0.2.5",
    "pyspark>=4.1.1",
    "mlflow>=3.12.0",
    "seaborn>=0.13.2",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
