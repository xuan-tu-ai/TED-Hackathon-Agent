services:
  postgres:
    image: postgres:16-alpine
    container_name: robot-agent-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: robot_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
