[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Anomaly detection sub-component for welding robots — Flow-Matching models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11.0",
    "numpy<2.3",
    "pandas>=2.3.3",
    "torchdiffeq>=0.2.5",
    "pyspark>=4.1.1",
    "mlflow>=3.12.0",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "notebook>=7.5.6",
    "mosaicml-streaming>=0.13.0",
    "databricks-sql-connector[pyarrow]",
    "databricks-sqlalchemy>=2.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
